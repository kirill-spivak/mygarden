services:
    db:
        image: postgres:18.6-bookworm
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - ./out/pg:/var/lib/postgresql/
        restart: always
